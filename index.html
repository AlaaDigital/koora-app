<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توقع المباراة</title>
    <!-- تضمين سكريبت إعلانات مونتاج Rewarded Popup -->
    <script src="//lib.monetag.com/v.js" data-zone="11820128" async></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 {
            color: #38bdf8;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input {
            background: #334155;
            color: #fff;
        }
        button {
            background: #0ea5e9;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #0284c7;
        }
        #loading {
            display: none;
            margin-top: 15px;
            color: #facc15;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3 id="welcome-user">مرحباً بك</h3>
        <h2 id="match-name">ريال مدريد ضد برشلونة</h2>
        <p>قم بإدخال توقعك للمباراة:</p>
        
        <form id="prediction-form">
            <input type="text" id="prediction" placeholder="مثال: 2-1" required>
            <button type="submit" id="submit-btn">إرسال التوقع</button>
            <div id="loading">جاري الإرسال وحفظ التوقع...</div>
        </form>
    </div>

    <!-- سكربت تليجرام ويب أب والمنطق -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // ضع رابط الـ Google Apps Script الخاص بك هنا
        const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

        // تهيئة تيليجرام ويب أب
        const tg = window.Telegram.WebApp;
        tg.expand();

        let username = "Guest";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            username = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name;
            document.getElementById("welcome-user").innerText = `مرحباً، ${tg.initDataUnsafe.user.first_name}`;
        }

        // دالة إرسال البيانات إلى جوجل شيت
        function sendDataToSheet() {
            const prediction = document.getElementById("prediction").value;
            const match = document.getElementById("match-name").innerText;

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
                body: JSON.stringify({
                    username: username,
                    prediction: prediction,
                    match: match
                })
            })
            .then(() => {
                setTimeout(() => {
                    tg.close();
                }, 1000);
            })
            .catch(error => {
                console.error("Error:", error);
                setTimeout(() => {
                    tg.close();
                }, 1000);
            });
        }

        document.getElementById("prediction-form").addEventListener("submit", function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById("submit-btn");
            const loading = document.getElementById("loading");

            submitBtn.style.display = "none";
            loading.style.display = "block";

            // تشغيل إعلان Rewarded Popup ثم إرسال البيانات بعد تفاعل المستخدم أو إغلاقه
            if (typeof show_11820128 === 'function') {
                show_11820128('pop').then(() => {
                    sendDataToSheet();
                }).catch(e => {
                    console.error("Ad error:", e);
                    sendDataToSheet();
                });
            } else {
                // في حال لم يتم تحميل السكريبت لسبب ما، يتم الإرسال مباشرة
                sendDataToSheet();
            }
        });
    </script>
</body>
</html>
