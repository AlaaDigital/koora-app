<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توقع المباريات</title>
    <!-- تضمين مكتبة تيليجرام ويب أب -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #0088cc; }
        .match-card {
            background: #eef2f3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #218838; }
        #loading {
            display: none;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>منصة التوقعات</h2>
        <p id="welcome-user">مرحباً بك</p>

        <div class="match-card" id="match-name">
            المباراة: ريال مدريد ضد برشلونة
        </div>

        <form id="prediction-form">
            <label for="prediction">اختر توقعك:</label>
            <select id="prediction" required>
                <option value="">-- اختر النتيجة --</option>
                <option value="فوز ريال مدريد">فوز ريال مدريد</option>
                <option value="تعادل">تعادل</option>
                <option value="فوز برشلونة">فوز برشلونة</option>
            </select>

            <button type="submit" id="submit-btn">إرسال التوقع</button>
            <div id="loading">جاري الإرسال وحفظ التوقع...</div>
        </form>
    </div>

    <!-- سكربت إعلانات Monetag (اختياري/يمكن استبدال الرابط بكود الإعلان الخاص بك) -->
    <script>
        // رابط الـ Google Apps Script الخاص بك (ضعه هنا بعد نشره)
        const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

        // تهيئة تيليجرام ويب أب
        const tg = window.Telegram.WebApp;
        tg.expand();

        let username = "Guest";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            username = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name;
            document.getElementById("welcome-user").innerText = `مرحباً، ${tg.initDataUnsafe.user.first_name}`;
        }

        document.getElementById("prediction-form").addEventListener("submit", function(e) {
            e.preventDefault();

            const prediction = document.getElementById("prediction").value;
            const match = document.getElementById("match-name").innerText;
            const submitBtn = document.getElementById("submit-btn");
            const loading = document.getElementById("loading");

            submitBtn.style.display = "none";
            loading.style.display = "block";

            // دمج إعلان Monetag كخطوة تفاعلية قبل الإرسال (اختياري، أو يتم فتحه كـ Popunder)
            try {
                // محاكاة استدعاء إعلان أو فتح رابط إعلاني إذا لزم الأمر
                // window.open('YOUR_MONETAG_AD_LINK', '_blank');
            } catch (err) {
                console.log("Ad error handled");
            }

            // إرسال البيانات إلى Google Sheets عبر Apps Script باستخدام no-cors لتفادي مشاكل الـ CORS
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
                body: JSON.stringify({
                    username: username,
                    prediction: prediction,
                    match: match
                })
            })
            .then(() => {
                alert("تم إرسال توقعك بنجاح!");
                tg.close(); // إغلاق الـ Web App والعودة للتيليجرام
            })
            .catch(error => {
                console.error("Error:", error);
                alert("حدث خطأ أثناء الإرسال، يجيب المحاولة لاحقاً.");
                submitBtn.style.display = "block";
                loading.style.display = "none";
            });
        });
    </script>
</body>
</html>
