<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توقعات المباريات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-top: 10px;
        }
        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }
        .team { font-weight: bold; font-size: 1.1em; }
        input[type="number"] {
            width: 50px;
            padding: 8px;
            font-size: 1.2em;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h2>⚽ مسابقة توقعات كورة دايلى</h2>
    <p>توقع النتيجة واكسب المتابعة!</p>

    <div class="card">
        <h3>مباراة اليوم</h3>
        <div class="teams">
            <div class="team">الفريق الأول</div>
            <input type="number" id="score1" min="0" value="0">
            <span>-</span>
            <input type="number" id="score2" min="0" value="0">
            <div class="team">الفريق الثاني</div>
        </div>
        <button onclick="submitPrediction()">إرسال التوقع 🚀</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function submitPrediction() {
            const score1 = document.getElementById('score1').value;
            const score2 = document.getElementById('score2').value;
            
            const data = {
                prediction: `${score1} - ${score2}`,
                user: tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "زائر"
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
