<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توقعات كورة دايلي</title>
  <!-- مكتبة تلجرام الرسمية للـ Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      border: 1px solid #334155;
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
    }
    .match-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #f1f5f9;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚽ مسابقة التوقعات</h2>
    <div class="match-title">الزمالك × غزل المحلة</div>
    
    <label for="predictionInput">سجل توقعك للنتيجة النهائية:</label>
    <input type="text" id="predictionInput" placeholder="مثال: 2-1 للزمالك">
    
    <button onclick="sendPrediction()">إرسال التوقع 🚀</button>
  </div>

  <script>
    // تهيئة تطبيق التلجرام
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand(); // توسيع الشاشة
    }

    // رابط Apps Script الخاص بك
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHgsMRzeazDEmoMJgbJTbesVYVJsixwPZTDn3W7qQYMUmwZWOlhBlkJusis51pQtsx/exec";

    function sendPrediction() {
      const predictionInput = document.getElementById("predictionInput").value;

      if (!predictionInput.trim()) {
        alert("يرجى كتابة التوقع أولاً!");
        return;
      }

      // جلب اسم المستخدم من تلجرام
      const telegramUser = tg?.initDataUnsafe?.user;
      const username = telegramUser 
        ? (telegramUser.username ? "@" + telegramUser.username : telegramUser.first_name) 
        : "مستخدم تجريبي";

      const matchName = "الزمالك × غزل المحلة";

      // إرسال البيانات إلى Google Sheets
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          username: username,
          prediction: predictionInput,
          match: matchName
        })
      })
      .then(() => {
        alert("تم تسجيل توقعك بنجاح في الجدول! بالتوفيق ⚽");
        if (tg) tg.close(); // إغلاق التطبيق في تلجرام بعد الإرسال
      })
      .catch(error => {
        console.error("Error:", error);
        alert("حدث خطأ أثناء الإرسال، حاول مجدداً.");
      });
    }
  </script>
</body>
</html>
