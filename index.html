<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توقعات كورة دايلي</title>
  <!-- مكتبة تلجرام الرسمية للـ Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0e14;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 20px;
      padding: 25px 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .badge {
      background: linear-gradient(45deg, #ff0055, #ff5050);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75em;
      font-weight: bold;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 10px;
    }
    h2 {
      margin: 5px 0 15px 0;
      color: #38bdf8;
      font-size: 1.5rem;
    }
    .match-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #f1f5f9;
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">🔥 التحدي المباشر</span>
    <h2>مسابقة التوقعات</h2>
    <div class="match-title">الزمالك × غزل المحلة</div>
    
    <label for="predictionInput">سجل توقعك للنتيجة النهائية:</label>
    <input type="text" id="predictionInput" placeholder="مثال: 2-1 للزمالك">
    
    <button onclick="sendPrediction()">إرسال التوقع 🚀</button>
  </div>

  <script>
    // تهيئة تطبيق التلجرام
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand(); // توسيع الشاشة لتملأ الفراغ المناسب في الموبايل
    }

    // رابط Apps Script الخاص بك
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHgsMRzeazDEmoMJgbJTbesVYVJsixwPZTDn3W7qQYMUmwZWOlhBlkJusis51pQtsx/exec";

    function sendPrediction() {
      const predictionInput = document.getElementById("predictionInput").value;

      if (!predictionInput.trim()) {
        alert("يرجى كتابة التوقع أولاً!");
        return;
      }

      // جلب اسم المستخدم من تلجرام
      const telegramUser = tg?.initDataUnsafe?.user;
      const username = telegramUser 
        ? (telegramUser.username ? "@" + telegramUser.username : telegramUser.first_name) 
        : "مستخدم تجريبي";

      const matchName = "الزمالك × غزل المحلة";

      const payload = {
        username: username,
        prediction: predictionInput,
        match: matchName
      };

      // إرسال البيانات إلى Google Sheets
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        cache: "no-cache",
        headers: {
          "Content-Type": "text/plain;charset=utf-8",
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("تم تسجيل توقعك بنجاح في الجدول! بالتوفيق ⚽");
        if (tg) tg.close(); // إغلاق التطبيق في تلجرام بعد الإرسال
      })
      .catch(error => {
        console.error("Error:", error);
        alert("تم الإرسال، شكراً لك!");
        if (tg) tg.close();
      });
    }
  </script>
</body>
</html>
