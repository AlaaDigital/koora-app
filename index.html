<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توقعات المباريات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            color: #ffcc00;
        }
        .teams {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 20px 0;
        }
        .team img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }
        .team span {
            display: block;
            margin-top: 8px;
            font-weight: bold;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input {
            background: #2c2c2c;
            color: #fff;
            text-align: center;
        }
        button {
            background: #ffcc00;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #e6b800;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>توقع نتيجة المباراة</h2>
        <div class="teams">
            <div class="team">
                <img src="https://i.imgur.com/VJrj3sC.png" alt="غزل المحلة">
                <span>غزل المحلة</span>
            </div>
            <span>VS</span>
            <div class="team">
                <img src="https://i.imgur.com/PFPjxmM.png" alt="الزمالك">
                <span>الزمالك</span>
            </div>
        </div>

        <input type="text" id="username" placeholder="اكتب اسمك الثلاثي">
        <input type="text" id="prediction" placeholder="توقعك (مثال: 2-1)">
        <button onclick="sendPrediction()">إرسال التوقع</button>
    </div>

    <script>
        function sendPrediction() {
            var name = document.getElementById('username').value;
            var pred = document.getElementById('prediction').value;
            if(name === "" || pred === "") {
                alert("الرجاء ملء جميع الحقول!");
                return;
            }
            alert("تم إرسال توقعك بنجاح، بالتوفيق!");
        }
    </script>

</body>
</html>
